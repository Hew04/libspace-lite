# Opens weekly pull requests to keep dependencies and GitHub Actions up to date.
# CI runs on each one; merge it if the checks pass.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps instead of many.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
